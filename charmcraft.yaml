type: charm
name: spark-operator-k8s
title: Kubeflow Spark Operator K8s
summary: Charmed Kubeflow Spark Operator, to run Spark applications declaratively on Kubernetes.
description: |
  Charm for the Kubeflow Spark Operator, a Kubernetes operator that runs Apache Spark
  applications described by SparkApplication, ScheduledSparkApplication and SparkConnect
  custom resources.

  The charm installs the operator CRDs and runs the operator controller. Service accounts for
  Spark drivers are not managed by the charm: create them in the namespaces the operator watches.

  This is a proof of concept: the mutating/validating admission webhook is not deployed yet.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

assumes:
  - juju >= 3.6
  - k8s-api

charm-libs:
  - lib: data_platform_libs.data_interfaces
    version: "0"
  - lib: spark_integration_hub_k8s.spark_service_account
    version: "0"

charm-user: non-root

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

config:
  options:
    log-level:
      description: |
        Log level of the Spark Operator controller.

        Acceptable values are: "debug", "info" and "error".
      default: "info"
      type: string
    controller-threads:
      description: |
        Number of workers that reconcile SparkApplication objects concurrently.
      default: 10
      type: int
    service-account:
      description: |
        Name of the Spark service account that is requested from the Spark Integration Hub, in
        the namespace of this model. Once the Hub grants it, it becomes the driver service
        account of the Spark applications that do not name one. Applications that name their
        own service account keep it.

        The default is applied by name to every watched namespace, so the account must exist in
        each of them: the Hub only creates it in the namespace of this model.
      default: "spark-operator"
      type: string
    job-namespaces:
      description: |
        Comma-separated list of namespaces in which the operator manages Spark applications.
        Spark resources created in any other namespace are ignored.

        An empty value (the default) means the namespace the charm is deployed to. The special
        value "*" makes the operator watch the whole cluster.
      default: ""
      type: string
    spark8t-submitter:
      description: |
        Submit Spark applications with the Spark properties that spark8t resolves for the driver
        service account, as the spark-client tools do: the properties of the service account,
        layered over the ones that the Integration Hub provides for it. The properties that a
        SparkApplication sets itself take precedence.

        Applications then must set `.spec.driver.serviceAccount` to a service account that exists
        in their namespace and is known to spark8t (see `spark-client.service-account-registry`).

        This requires the spark-operator rock, and is not supported by the upstream image.
      default: false
      type: boolean

requires:
  spark-service-account:
    interface: spark_service_account
    limit: 1
    optional: true
    description: |
      Request a Spark service account from the Spark Integration Hub. The Hub creates it in the
      namespace of this model, and the operator uses it as the driver service account of the
      Spark applications that do not name one.

actions:
  restart:
    description: Restart the Spark Operator controller in this unit.

containers:
  controller:
    resource: controller-image
    # The user of the spark-operator rock, shared with the other Charmed Apache Spark rocks.
    uid: 584792
    gid: 584792

resources:
  controller-image:
    type: oci-image
    description: OCI image of the Spark Operator, built from the spark-operator rock.
    # The upstream image runs as uid 185 and is not compatible with the container user above.
    # For local testing, deploy the rock built by ../spark-operator-rock.
    upstream-source: ghcr.io/kubeflow/spark-operator/controller:2.6.0
