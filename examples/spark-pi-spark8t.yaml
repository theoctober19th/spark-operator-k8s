# Spark Pi, run as a service account created with spark-client / spark8t:
#
#   spark-client.service-account-registry create --username etl --namespace spark-poc-jobs
#   juju config spark-operator-k8s job-namespaces=spark-poc-jobs   # the operator must watch it
#
# The `namespace:service-account` pair of spark-client maps to `metadata.namespace` (where the
# driver and executors run) and `spec.driver.serviceAccount` (an account in that same namespace).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-poc-jobs
spec:
  type: Scala
  mode: cluster
  image: docker.io/apache/spark:4.2.1
  sparkVersion: "4.2.1"
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  driver:
    cores: 1
    memory: 512m
    serviceAccount: etl
  executor:
    instances: 2
    cores: 1
    memory: 512m
