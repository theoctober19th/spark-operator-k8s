# Spark Pi, run by the operator that this charm deploys.
#
# The `spark` service account is created by the charm in every namespace the operator watches
# (by default, the namespace of the Juju model). Adjust `metadata.namespace` accordingly.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-operator-poc
spec:
  type: Scala
  mode: cluster
  image: docker.io/apache/spark:4.2.1
  sparkVersion: "4.2.1"
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark
  executor:
    instances: 2
    cores: 1
    memory: 512m
